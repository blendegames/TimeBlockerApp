name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper runnable
        run: chmod +x gradlew

      - name: Logic tests, screen tests and debug APK
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug --console=plain

      - name: Upload the app (install this on your phone)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focustask-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Upload screenshots of every screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/screens/*.png
          if-no-files-found: ignore
